<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>
            Flex-контейнеры и flex-элементы
        </title>
        <style>
            div {
                border: 1px dotted black;
            }
            .div1 div, .div2 div, .div3 div {
                height: 40px;
            }
            .div1 {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: space-evenly;
                height: 150px;
            }
            .div1 div {
                flex-grow: 0;
                margin-left: 10px;
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .div2 div {
                border-color: blue;
            }
            .div2 {
                display: flex;
                flex-wrap: nowrap;
                align-content: stretch;
                height: 200px;
                flex-direction: row;
            }
            .div1_1 {
                order: 1;
            }
            .div1_3 {
                order: -1;
            }
            .div2 .div2_1 {
                flex-grow: 3;
                flex-basis: 70px;
            }
            .div2 .div2_2 {
                flex-grow: 2;
                flex-basis: 50px;
                align-self: flex-end;
            }
            .div2 .div2_3 {
                flex-grow: 1;
                flex-basis: 100px;
            }

        </style>
    </head>
    <body>
        <h1>Изучение флексбоксов</h1>
        <div class="div1">
            <div class="div1_1">
                Элемент 1

            </div>
            <div class="div1_2">
                Элемент 2

            </div>
            <div class="div1_3">
                Элемент 3

            </div>

        </div>
        <div class="div2">
            <div class="div2_1">

            </div>
            <div class="div2_2">

            </div>
            <div class="div2_3">
                
            </div>
            <div>

            </div>
            <div>

            </div>

        </div>
        <div class="div3">
            <div class="div3_1">

            </div>
            <div class="div3_2">

            </div>
            <div class="div3_3">
                
            </div>

        </div>

    </body>
</html>
